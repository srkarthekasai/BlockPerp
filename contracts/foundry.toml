
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Solidity compiler
solc_version = "0.8.30"
auto_detect_solc = false

# Optimization
optimizer = true
optimizer_runs = 200
via_ir = false

# Formatting and build reproducibility
bytecode_hash = "none"

# Gas reports: report gas usage for all contracts
gas_reports = ["*"]

# Fuzz testing
[profile.default.fuzz]
runs = 256

# Invariant testing
[profile.default.invariant]
runs = 128
depth = 50

# CI profile
[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 50 }

# Solidity formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
